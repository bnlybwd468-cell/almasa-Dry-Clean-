function paintMine(){const e=$("ml");if(!e)return;e.innerHTML=orders.length?orders.map(o=>`<div class="li"><b dir="ltr">${E(o.no)}</b> — ${E(o.service)} <span class="tag">${ST[o.status]}</span>${o.status===8&&o.cancelReason?`<br><span class="er">سبب الإلغاء: ${E(o.cancelReason)}</span>`:""}<br><span class="mu">${o.price?`السعر قبل الخصم: ${o.price+(o.discount||0)} • الخصم: ${o.discount\vert{}\vert{}0} • الإجمالي: ${o.price} • المدفوع: ${o.paid\vert{}\vert{}0} • المتبقي: ${o.price-(o.paid||0)} ج.م`:"السعر: بانتظار تأكيد الإدارة"}</span></div>`).join(""):"لا توجد طلبات بعد."}

function paintAdmin(){
 if(!role||view!=="admin")return;

}

function stop(){unsubs.forEach(u=>u());unsubs=[]}

function boot(){
 stop();orders=[];chats=[];allOrders=[];admins=[];invs=[];own=null;role=null;
 if(!user){nav();return}
 getDoc(doc(db,"users",user.uid)).then(x=>{if(x.exists())prof=x.data()}).catch(()=>{});
 const sub=(q,f)=>unsubs.push(onSnapshot(q,x=>{f(x);nav();paintMine();paintAdmin()},()=>{}));
 sub(query(collection(db,"orders"),where("uid","==",user.uid)),x=>orders=x.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts));
 sub(doc(db,"chats",user.uid),x=>own=x.exists()?x.data():null);
 getDoc(doc(db,"admins",user.uid)).then(x=>{
  if(x.exists()){
   role=x.data().role;
   const L=(c,f)=>sub(query(collection(db,c)),y=>f(y.docs.map(d=>({id:d.id,...d.data()}))));
   L("orders",a=>allOrders=a);L("admins",a=>admins=a);L("chats",a=>chats=a.sort((p,q)=>q.ts-p.ts));
   if(role==="owner")L("invites",a=>invs=a);
   nav();
  }else tryInvite();
 }).catch(()=>{});
}

async function tryInvite(){
 try{
  const s=await getDoc(doc(db,"invites",user.email));
  if(s.exists()&&user.emailVerified){
   await setDoc(doc(db,"admins",user.uid),{role:s.data().role,email:user.email});
   await deleteDoc(doc(db,"invites",user.email)).catch(()=>{});
   location.reload();
  }
 }catch(e){}
}

 if(t.id==="vf"){e.preventDefault();try{await sendEmailVerification(user);alert("أُرسل رابط التفعيل إلى بريدك")}catch(x){alert("تعذر الإرسال الآن")}}
 if(t.id==="lo"){await signOut(auth);go("home")}
 if(t.id==="p-s"){try{await setDoc(doc(db,"users",user.uid),{name:V("p-n"),phone:V("p-p")});prof={name:V("p-n"),phone:V("p-p")};say("p-r","تم الحفظ","ok")}catch(x){say("p-r","تعذر الحفظ، حاول مرة أخرى.")}}
 if(t.id==="a-go"){
  const m=t.dataset.m,r="a-r";if(!ready())return say(r,"الموقع غير مربوط بقاعدة البيانات بعد.");
  const em=V("a-e");if(!em)return say(r,"أدخل البريد الإلكتروني.");t.disabled=true;
  try{
   if(m==="rs"){await sendPasswordResetEmail(auth,em);say(r,"أُرسل رابط الاستعادة إلى بريدك.","ok")}
   else if(m==="up"){
    const n=V("a-n"),p=V("a-p"),w=$("a-w").value;
    if(n.length<3||!/^01\d{9}$/.test(p))throw"أدخل الاسم ورقم هاتف مصري صحيح.";
    if(w!==$("a-w2").value)throw"كلمتا المرور غير متطابقتين.";
    if(!$("a-c").checked)throw"يلزم الموافقة على سياسة الخصوصية.";
    const c=await createUserWithEmailAndPassword(auth,em,w);
    await setDoc(doc(db,"users",c.user.uid),{name:n,phone:p});
    prof={name:n,phone:p};sendEmailVerification(c.user).catch(()=>{});user=c.user;boot();go(pend?"chat":"home");
   }else{await signInWithEmailAndPassword(auth,em,$("a-w").value)}
  }catch(x){say(r,typeof x==="string"?x:AE[x.code]||"حدث خطأ، حاول مرة أخرى.")}
  t.disabled=false;
 }
 if(t.id==="o-go"){
  const r="o-r";if(busy)return;const n=V("o-n"),p=V("o-p"),a=V("o-a"),sv=[...document.querySelectorAll(".sv:checked")].map(x=>x.value).join(" + "),d=V("o-d"),h=V("o-h");
  if(n.length<3||!/^01\d{9}$/.test(p)||a.length<4)return say(r,"تأكد من الاسم ورقم هاتف مصري صحيح (11 رقمًا) والعنوان.");
  if(!sv)return say(r,"اختر خدمة واحدة على الأقل.");if(!d||!h)return say(r,"حدد يوم ووقت الاستلام.");
  const q=V("o-q");busy=true;t.disabled=true;t.textContent="جاري الإرسال…";
  const no="DD-"+Math.floor(100000+Math.random()*900000),o={uid:user.uid,no,name:n,phone:p,addr:a,service:sv,items:V("o-t"),qty:q,day:d,time:h,method:V("o-m"),code:V("o-c").toUpperCase(),notes:V("o-x"),status:0,price:0,paid:0,discount:0,log:[{t:Date.now(),x:"تم استلام الطلب"}],ts:Date.now()};
  try{await setDoc(doc(db,"orders",no),o);go("done",o)}catch(x){say(r,"تعذر حفظ الطلب.");t.disabled=false;t.textContent="🔁 إعادة المحاولة"}busy=false;
 }
 if(t.id==="c-s"){
  const x=V("c-t");if(!x)return;if(!user){pend=x;return go("login","in")}t.disabled=true;
  try{
   await addDoc(collection(db,"chats",user.uid,"msgs"),{from:"c",text:x,no:V("c-o").toUpperCase(),ts:Date.now()});
   await setDoc(doc(db,"chats",user.uid),{name:prof.name||user.email,last:x,from:"c",ts:Date.now(),closed:false},{merge:true});
   if($("c-t"))$("c-t").value="";pend="";
  }catch(y){say("c-r","تعذر إرسال الرسالة.")}t.disabled=false;
 }
 if(t.id==="is"&&sel){
  const x=V("ir");if(!x)return;
  try{
   await addDoc(collection(db,"chats",sel,"msgs"),{from:"a",text:x,ts:Date.now()});
   await setDoc(doc(db,"chats",sel),{last:x,from:"a",ts:Date.now()},{merge:true});
   if($("ir"))$("ir").value="";
  }catch(y){}
 }
});
</script></body></html>
